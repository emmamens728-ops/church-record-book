<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <radialGradient id="mottoBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="70%" stop-color="#172554" />
      <stop offset="100%" stop-color="#090d16" />
    </radialGradient>
    <linearGradient id="goldMotto" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="30%" stop-color="#f59e0b" />
      <stop offset="70%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#92400e" />
    </linearGradient>
    <filter id="mottoShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Circular Outer Medallion -->
  <circle cx="250" cy="250" r="235" fill="none" stroke="url(#goldMotto)" stroke-width="8" />
  <circle cx="250" cy="250" r="222" fill="none" stroke="#fef08a" stroke-width="2" stroke-dasharray="4,4" />
  <circle cx="250" cy="250" r="215" fill="url(#mottoBg)" />

  <!-- Stars -->
  <g fill="url(#goldMotto)">
    <polygon points="250,55 253,65 264,65 255,71 258,81 250,75 242,81 245,71 236,65 247,65" />
    <polygon points="120,105 123,115 134,115 125,121 128,131 120,125 112,131 115,121 106,115 117,115" />
    <polygon points="380,105 383,115 394,115 385,121 388,131 380,125 372,131 375,121 366,115 377,115" />
  </g>

  <!-- Central Anointing & Flame Symbolism -->
  <g filter="url(#mottoShadow)" transform="translate(0, -10)">
    <!-- Rays of God's Power -->
    <path d="M 250,130 L 250,220 M 210,145 L 235,215 M 290,145 L 265,215 M 180,180 L 225,225 M 320,180 L 275,225" stroke="url(#goldMotto)" stroke-width="2" stroke-linecap="round" opacity="0.6" />
    <!-- White Dove descending in power -->
    <path d="M 250,180 C 270,150 300,135 330,130 C 315,150 305,170 290,185 C 310,175 325,170 335,170 C 320,190 300,205 285,212 C 265,220 250,210 250,210 Z" fill="#ffffff" />
    <path d="M 250,180 C 230,150 200,135 170,130 C 185,150 195,170 210,185 C 190,175 175,170 165,170 C 180,190 200,205 215,212 C 235,220 250,210 250,210 Z" fill="#ffffff" />
    <ellipse cx="250" cy="160" rx="9" ry="11" fill="#ffffff" />
    <polygon points="250,150 246,156 254,156" fill="#fbbf24" />
  </g>

  <!-- Banner & Motto Text -->
  <rect x="80" y="245" width="340" height="2" fill="url(#goldMotto)" />

  <text x="250" y="280" font-family="'Cinzel', Georgia, serif" font-weight="900" font-size="28" fill="url(#goldMotto)" text-anchor="middle" letter-spacing="3" filter="url(#mottoShadow)">
    HEAVEN OO!!!
  </text>
  <text x="250" y="325" font-family="'Cinzel', Georgia, serif" font-weight="800" font-size="26" fill="#fef08a" text-anchor="middle" letter-spacing="2" filter="url(#mottoShadow)">
    ƐHO ƐNA YƐPƐ
  </text>

  <rect x="120" y="348" width="260" height="1.5" fill="url(#goldMotto)" />

  <text x="250" y="380" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="14" fill="#93c5fd" text-anchor="middle" letter-spacing="4">
    HOUSE OF POWER MINISTRY
  </text>
  <text x="250" y="405" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="12" fill="#cbd5e1" text-anchor="middle" letter-spacing="3">
    MANKESSIM • CENTRAL REGION
  </text>
</svg>
